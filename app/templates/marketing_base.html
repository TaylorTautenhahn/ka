<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f5ef" />
    <title>{% block title %}BidBoard{% endblock %}</title>
    <meta name="description" content="{% block description %}A shared place for your chapter's recruitment. Keep people, conversations, and next steps together with BidBoard.{% endblock %}" />
    <link rel="apple-touch-icon" href="{{ asset_url('icons/icon-192.png') }}" />
    <link rel="stylesheet" href="{{ asset_url('css/landing.css') }}" />
    <script src="{{ asset_url('js/pwa_shell.js') }}" defer></script>
    <script src="{{ asset_url('js/landing.js') }}" defer></script>
    {% block extra_head %}{% endblock %}
  </head>
  <body class="bb-page {% block body_class %}{% endblock %}">
    <a class="bb-skip-link" href="#main-content">Skip to content</a>
    <div class="bb-shell">
      <header class="bb-topbar">
        <a class="bb-brand" href="/" aria-label="BidBoard home">
          <span class="bb-brand-mark" aria-hidden="true">b.</span>
          <span>BidBoard</span>
        </a>
        <button id="bbNavToggle" class="bb-nav-toggle" type="button" aria-controls="bbPrimaryNav" aria-expanded="false" hidden>
          <span class="bb-nav-toggle-lines" aria-hidden="true"></span>
          <span class="sr-only" data-nav-label>Open navigation</span>
        </button>
        <nav id="bbPrimaryNav" class="bb-nav" aria-label="Primary">
          <a href="/features"{% if nav_key == 'features' %} aria-current="page"{% endif %}>Product</a>
          <a href="/faq"{% if nav_key == 'faq' %} aria-current="page"{% endif %}>FAQ</a>
        </nav>
        <a class="bb-button bb-header-cta" href="/organizations"{% if nav_key == 'organizations' %} aria-current="page"{% endif %}>Find your chapter <span aria-hidden="true">&nearr;</span></a>
      </header>
      <main id="main-content" tabindex="-1">
        {% block page_content %}{% endblock %}
      </main>
      <footer class="bb-footer">
        <div class="bb-footer-branding">
          <a class="bb-brand" href="/">BidBoard<span class="bb-brand-dot" aria-hidden="true">.</span></a>
          <p>For the people who make a chapter.</p>
        </div>
        <nav class="bb-footer-links" aria-label="Footer">
          <a href="/features">Product</a>
          <a href="/faq">FAQ</a>
          <a href="/organizations">Chapter login</a>
          <a href="/platform">Platform admin</a>
        </nav>
        <p class="bb-footer-note">Recruitment, with room for the human part.</p>
      </footer>
    </div>
  </body>
</html>
